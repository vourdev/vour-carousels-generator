# Build here, ship into the VPS. Deliberately not the usual "runner pushes to a registry,
# server pulls": that box cannot reach the npm registry or Docker Hub at any useful rate.
#
# It does not stream a docker image in either, which is what this workflow used to do.
# The uplink drops 12-60% of the box's outbound packets, and that breaks bulk transfers in
# BOTH directions -- an inbound transfer still needs the box to ACK, and when the ACKs are
# what is being lost the sender's window collapses. Measured 25 Aug 2026: under 50 KB/s
# sustained. A 122 MB `docker save` stream never finished, and three runs in a row died on
# the job timeout with the ssh still hanging.
#
# So the bytes had to go, not the timeout. The runner now rsyncs the *build output* --
# rsync sends only what changed and resumes what it started -- and the VPS assembles the
# image from a base that already sits on its disk. Steady-state deploys move a few MB.
name: Deploy to VPS

on:
  push:
    branches: [vour-carousels-saas]
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: a half-applied rsync would leave the
# app directory mixing two builds.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Reported, not enforced. The repo carries 25 pre-existing lint errors (mostly
      # `no-explicit-any` in code this change did not touch), and blocking on them would
      # mean no deploy could ship until an unrelated cleanup lands. Tests below do block.
      - name: Lint (report only)
        continue-on-error: true
        run: npx eslint app lib components

      - name: Test
        run: npm test

      # Built on the runner rather than inside docker, because what gets shipped is the
      # output directory, not an image. ubuntu-latest is x64 glibc like the runtime base,
      # so the native bindings next traces into standalone (@libsql/linux-x64-gnu) are the
      # right ones.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # standalone carries its own traced node_modules; static and public are not traced
      # because nothing imports them, so they are staged beside it -- the same layout the
      # old Dockerfile assembled.
      - name: Stage the deploy tree
        run: |
          rm -rf deploy-out
          cp -r .next/standalone deploy-out
          mkdir -p deploy-out/.next
          cp -r .next/static deploy-out/.next/static
          cp -r public deploy-out/public
          test -f deploy-out/server.js || { echo "no server.js in the standalone output"; exit 1; }
          du -sh deploy-out

      - name: Ship and deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          SSH="ssh -i $HOME/.ssh/id_ed25519 -p $PORT -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o ConnectTimeout=30"

          # --checksum, not the default size+mtime: npm ci gives every file a fresh
          # timestamp on every run, so by mtime the whole 90 MB of traced node_modules
          # looks new each deploy when its contents are identical.
          # --partial so a run that dies mid-file resumes instead of restarting, and
          # --timeout so a stalled link fails the attempt in three minutes rather than
          # hanging until the job timeout, which is exactly how the old workflow died.
          for attempt in 1 2 3 4 5; do
            echo "::group::rsync attempt $attempt"
            if rsync -az --checksum --delete --partial --timeout=180 \
                     --info=stats2 -e "$SSH" \
                     deploy-out/ "root@$HOST:/"; then
              echo "::endgroup::"
              echo "synced on attempt $attempt"
              SYNCED=1
              break
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed"
            sleep 20
          done
          [ "${SYNCED:-}" = 1 ] || { echo "rsync failed five times -- see the uplink notes in deploy/ci-deploy-carousels.sh"; exit 1; }

          # The image is built on the VPS from what was just synced. Small, local, and
          # nothing crosses the network here but this one command.
          $SSH "root@$HOST" "deploy ${{ github.sha }}"

      - name: Verify it answers
        env:
          URL: https://carousels-generator.vour.dev
        run: |
          for i in $(seq 1 20); do
            code=$(curl -so /dev/null -w '%{http_code}' --max-time 20 "$URL/login" || true)
            echo "attempt $i: $code"
            case "$code" in 200|302|307) echo "up"; exit 0 ;; esac
            sleep 10
          done
          echo "did not come up"; exit 1
