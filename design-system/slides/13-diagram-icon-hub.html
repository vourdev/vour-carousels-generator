<!-- @dsCard group="Slides" viewport="1080x1350" name="Update 3 · Icon hub" subtitle="Center node → 4 line-art tool icons (Database/Sheet/Browser/Doc)" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width:1080px; height:1350px; }
  body {
    margin:0; padding:96px 80px 80px;
    background: var(--bg-editorial);
    color: var(--ed-ink);
    font-family: var(--font-body);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .counter { font-family:var(--font-mono); font-size:24px; color:var(--ed-ink-faint); letter-spacing:.04em; }
  .eyebrow { font-family:var(--font-mono); font-weight:500; font-size:24px; letter-spacing:.18em; text-transform:uppercase; color:var(--ed-orange); margin-top:48px; }
  h1 { font-family:var(--font-display); font-weight:800; font-size:88px; line-height:1.04; letter-spacing:-.025em; margin:24px 0 0; color:var(--ed-ink); }
  h1 .a { color: var(--ed-orange); }
  .body-text { font-family:var(--font-body); font-weight:500; font-size:32px; line-height:1.4; color:var(--ed-ink-soft); margin: 24px 0 0; max-width: 900px; }
  .body-text strong { color: var(--ed-ink); font-weight: 700; }
  .diag-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: 40px; }
  .catatan { border: 1.5px solid var(--ed-orange); border-radius: 16px; padding: 24px 32px; margin-top: 40px; }
  .catatan-label { font-family: var(--font-mono); font-weight: 500; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ed-orange); }
  .catatan-body { margin-top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 32px; color: var(--ed-ink); }

  /* Node primitive */
  .node.filled.big {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 20px 44px; min-height: 96px; min-width: 180px;
    background: var(--ed-orange); border: 1.5px solid var(--ed-orange);
    color: #fff; border-radius: 20px;
    font-family: var(--font-display); font-weight: 700; font-size: 44px;
    letter-spacing: -0.02em; line-height: 1;
  }

  /* Icon hub */
  .diag-icon-hub { position: relative; width: 100%; max-width: 900px; height: 400px; }
  .diag-icon-hub .center { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; }
  .diag-icon-hub .tools { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; }
  .diag-icon-hub .tool { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 22%; }
  .diag-icon-hub .tool .glyph { width: 96px; height: 96px; }
  .diag-icon-hub .tool .glyph svg {
    width: 100%; height: 100%;
    stroke: var(--ed-ink); stroke-width: 1.75; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .diag-icon-hub .tool .label { font-family: var(--font-mono); font-size: 22px; color: var(--ed-ink-muted); text-align: center; line-height: 1; }
  .diag-icon-hub svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .diag-icon-hub svg.lines .stroke {
    stroke: var(--ed-orange); stroke-width: 1.5; fill: none;
    stroke-dasharray: 6 6;
  }
  .diag-icon-hub svg.lines .head { fill: var(--ed-orange); }
</style>
</head>
<body>
  <div class="counter">05 / 08</div>
  <div class="eyebrow">Istilah #5</div>
  <h1>MCP <span class="a">Hub</span></h1>
  <p class="body-text">
    <strong>Model Context Protocol</strong> — satu AI, empat tools. Jembatan standar antara model &amp; sistem lo.
  </p>

  <div class="diag-wrap">
    <div class="diag-icon-hub">
      <div class="center"><div class="node filled big">AI</div></div>

      <svg class="lines" viewBox="0 0 900 400" preserveAspectRatio="none">
        <path class="stroke" d="M 450 96 Q 450 220 99 320" />
        <path class="stroke" d="M 450 96 Q 450 220 333 320" />
        <path class="stroke" d="M 450 96 Q 450 220 567 320" />
        <path class="stroke" d="M 450 96 Q 450 220 801 320" />
        <polygon class="head" points="91,316 107,316 99,329" />
        <polygon class="head" points="325,316 341,316 333,329" />
        <polygon class="head" points="559,316 575,316 567,329" />
        <polygon class="head" points="793,316 809,316 801,329" />
      </svg>

      <div class="tools">
        <div class="tool">
          <div class="glyph">
            <svg viewBox="0 0 60 60">
              <ellipse cx="30" cy="14" rx="18" ry="5"/>
              <path d="M12 14 v32 c0 3 8 5 18 5 s18 -2 18 -5 v-32"/>
              <path d="M12 26 c0 3 8 5 18 5 s18 -2 18 -5"/>
              <path d="M12 38 c0 3 8 5 18 5 s18 -2 18 -5"/>
            </svg>
          </div>
          <div class="label">Database</div>
        </div>
        <div class="tool">
          <div class="glyph">
            <svg viewBox="0 0 60 60">
              <rect x="10" y="10" width="40" height="40" rx="3"/>
              <line x1="10" y1="22" x2="50" y2="22"/>
              <line x1="10" y1="34" x2="50" y2="34"/>
              <line x1="10" y1="46" x2="50" y2="46"/>
              <line x1="24" y1="10" x2="24" y2="50"/>
              <line x1="38" y1="10" x2="38" y2="50"/>
            </svg>
          </div>
          <div class="label">Sheet</div>
        </div>
        <div class="tool">
          <div class="glyph">
            <svg viewBox="0 0 60 60">
              <rect x="8" y="12" width="44" height="36" rx="3"/>
              <line x1="8" y1="22" x2="52" y2="22"/>
              <circle cx="14" cy="17" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="20" cy="17" r="1.6" fill="currentColor" stroke="none"/>
              <circle cx="26" cy="17" r="1.6" fill="currentColor" stroke="none"/>
              <line x1="14" y1="30" x2="46" y2="30"/>
              <line x1="14" y1="37" x2="46" y2="37"/>
              <line x1="14" y1="44" x2="34" y2="44"/>
            </svg>
          </div>
          <div class="label">Browser</div>
        </div>
        <div class="tool">
          <div class="glyph">
            <svg viewBox="0 0 60 60">
              <path d="M14 8 h22 l12 12 v34 a2 2 0 0 1 -2 2 h-32 a2 2 0 0 1 -2 -2 v-44 a2 2 0 0 1 2 -2 z"/>
              <path d="M36 8 v12 h12"/>
              <line x1="20" y1="30" x2="40" y2="30"/>
              <line x1="20" y1="38" x2="40" y2="38"/>
              <line x1="20" y1="46" x2="34" y2="46"/>
            </svg>
          </div>
          <div class="label">Doc</div>
        </div>
      </div>
    </div>
  </div>

  <div class="catatan">
    <div class="catatan-label">Catatan</div>
    <div class="catatan-body">MCP = satu jembatan ke banyak tools.</div>
  </div>
</body>
</html>
