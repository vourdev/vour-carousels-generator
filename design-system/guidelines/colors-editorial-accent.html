<!-- @dsCard group="Colors" viewport="700x160" name="Editorial · Accent" subtitle="Orange — eyebrows + numbered badges + headline keyword only" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-editorial); font-family:var(--font-mono); color:var(--ed-ink-soft); }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .sw { padding:12px 14px; border-radius:12px; background:#fff8; border:1px solid rgba(31,9,4,0.05); }
  .chip { width:100%; height:64px; border-radius:8px; margin-bottom:8px; }
  .name { font-size:11px; color:var(--ed-ink-muted); }
  .val { font-size:13px; margin-top:4px; color:var(--ed-ink); }
  .role { font-size:11px; color:var(--ed-ink-muted); margin-top:6px; font-family:var(--font-body); font-style:italic; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#EE4B1A"></div><div class="name">--ed-orange</div><div class="val">#EE4B1A</div><div class="role">eyebrow · keyword · numbered badge</div></div>
  <div class="sw"><div class="chip" style="background:#F5895F"></div><div class="name">--ed-orange-soft</div><div class="val">#F5895F</div><div class="role">hover · soft variant</div></div>
  <div class="sw"><div class="chip" style="background:#14110E"></div><div class="name">--ed-callout-ink</div><div class="val">#14110E</div><div class="role">dark callout · terminal</div></div>
</div>
</body></html>
