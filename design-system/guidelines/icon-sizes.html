<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-editorial); font-family:var(--font-mono); color:var(--ed-ink); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:9px 12px; border-bottom:1px solid rgba(31,9,4,.08); font-size:13px; }
  th { font-size:11px; color:var(--ed-ink-muted); text-transform:uppercase; letter-spacing:.12em; font-weight:500; }
  .tk { color:var(--ed-ink-soft); }
  .px { color:var(--ed-ink); width:64px; }
  .note { font-family:var(--font-body); color:var(--ed-ink-muted); font-size:12px; }
</style></head>
<body>
<table>
  <tr><th>Container</th><th>Container</th><th>Glyph</th><th>Where</th></tr>
  <tr><td class="tk">Editorial card icon</td><td class="px">48</td><td class="px">24</td><td class="note">info card</td></tr>
  <tr><td class="tk">Editorial callout icon</td><td class="px">40</td><td class="px">24</td><td class="note">dark callout</td></tr>
  <tr><td class="tk">Numbered step badge</td><td class="px">40</td><td class="px">22</td><td class="note">step 1 / 2 / 3</td></tr>
  <tr><td class="tk">Mock-screen lock badge</td><td class="px">44</td><td class="px">26</td><td class="note">locked scene overlay</td></tr>
  <tr><td class="tk">Brand mark (cover)</td><td class="px">72</td><td class="px">—</td><td class="note">cover + outro</td></tr>
  <tr><td class="tk">Brand mark (inner)</td><td class="px">44</td><td class="px">—</td><td class="note">inner slide pill</td></tr>
  <tr><td class="tk">Brand mark (in-card)</td><td class="px">40</td><td class="px">—</td><td class="note">smallest allowed</td></tr>
</table>
</body></html>
