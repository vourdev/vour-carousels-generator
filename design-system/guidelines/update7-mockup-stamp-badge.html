<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  body {
    margin:0; padding:28px 28px 20px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display:flex; flex-direction:column; gap:14px; overflow:hidden;
  }
  .hd { display:flex; align-items:center; justify-content:space-between; }
  .lbl {
    font-family: var(--font-mono); font-size:11px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .note { font-family: var(--font-mono); font-size:11px; color: var(--ed-ink-faint); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; }

  .body-copy { font-family: var(--font-display); font-weight:800; font-size: 22px; line-height: 1.15; color: var(--ed-ink); max-width: 340px; }
  .stamp {
    display: inline-block; padding: 8px 14px; border: 1.5px solid var(--ed-orange); border-radius: 6px;
    font-family: var(--font-mono); font-weight:500; font-size: 11px; color: var(--ed-ink); background: var(--ed-paper);
    transform: rotate(-4deg); margin-top: 18px; letter-spacing:.02em;
  }
  .stamp b { color: var(--ed-orange); font-weight:700; }
</style></head><body>
  <div class="hd"><div class="lbl">StampBadge</div><div class="note">Tilted callout</div></div>
  <div class="stage">
    <div style="text-align:center;">
      <div class="body-copy">Skill yang paling dicari perusahaan sekarang.</div>
      <div class="stamp"><b>Highest-paying skill</b> saat ini</div>
    </div>
  </div>
</body></html>
