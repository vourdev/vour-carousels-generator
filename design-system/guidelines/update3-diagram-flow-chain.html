<!-- @dsCard group="Diagrams · Update 3" viewport="620x360" name="Flow chain" subtitle="Sequential nodes with → arrows" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body {
    margin:0; padding:32px; background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body); display:flex; flex-direction:column; gap:16px; overflow:hidden;
  }
  .hd { display:flex; align-items:baseline; justify-content:space-between; }
  .lbl { font-family: var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange); }
  .note { font-family: var(--font-mono); font-size:12px; color: var(--ed-ink-muted); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px 8px; }

  /* Component vocabulary (identical to slides/) */
  .node { display:inline-flex; align-items:center; gap:12px; padding:10px 18px; min-height:48px;
    background:var(--ed-node-fill); border:1.5px solid var(--ed-line-ink); border-radius:12px;
    font-family:var(--font-mono); font-weight:500; font-size:18px; color:var(--ed-ink); white-space:nowrap; }
  .node.filled { background:var(--ed-orange); border-color:var(--ed-orange); color:#fff; font-family:var(--font-display); font-weight:700; }
  .node.big { padding:14px 28px; font-size:26px; font-family:var(--font-display); font-weight:700; border-radius:16px; }

  .diag-hub { position:relative; width:100%; max-width:640px; height:220px; }
  .diag-hub .center { position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2; }
  .diag-hub .children { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; }
  .diag-hub svg { position:absolute; inset:0; width:100%; height:100%; }
  .diag-hub svg .stroke { stroke:var(--ed-orange); stroke-width:1.5; fill:none; }
  .diag-hub svg .head { fill:var(--ed-orange); }

  .diag-flow { display:flex; align-items:center; gap:12px; }
  .diag-flow .arrow { color:var(--ed-orange); font-size:26px; font-family:var(--font-mono); }

  .diag-tokens { display:flex; gap:12px; }
  .diag-tokens .col { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .diag-tokens .chip { padding:8px 14px; border:1.5px solid var(--ed-orange); border-radius:8px; background:var(--ed-node-fill); font-family:var(--font-mono); font-size:16px; color:var(--ed-ink); min-width:56px; text-align:center; }
  .diag-tokens .drop { color:var(--ed-ink-muted); font-size:18px; }

  .diag-bars { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; }
  .diag-bars .panel { border:1.5px solid var(--ed-orange); border-radius:14px; padding:14px 16px; min-height:170px; display:flex; flex-direction:column; gap:8px; }
  .diag-bars .panel.loser { border-color:var(--ed-line-red); }
  .diag-bars .panel .h { font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ed-orange); }
  .diag-bars .panel.loser .h { color:var(--ed-line-red); }
  .diag-bars .rows { display:flex; flex-direction:column; gap:6px; flex:1; justify-content:center; }
  .diag-bars .bar { height:12px; border-radius:3px; background:var(--ed-orange); }
  .diag-bars .bar.dim { background:var(--ed-ink-faint); opacity:.45; }
  .diag-bars .bar.faded { background:var(--ed-line-red); opacity:.35; }
  .diag-bars .foot { font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ed-orange); }
  .diag-bars .panel.loser .foot { color:var(--ed-line-red); }

  .diag-icon-hub { position:relative; width:100%; max-width:640px; height:280px; }
  .diag-icon-hub .center { position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:2; }
  .diag-icon-hub .tools { position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-end; }
  .diag-icon-hub .tool { display:flex; flex-direction:column; align-items:center; gap:6px; width:22%; }
  .diag-icon-hub .glyph { width:52px; height:52px; }
  .diag-icon-hub .glyph svg { width:100%; height:100%; stroke:var(--ed-ink); stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .diag-icon-hub .label { font-family:var(--font-mono); font-size:12px; color:var(--ed-ink-muted); }
  .diag-icon-hub svg.lines { position:absolute; inset:0; width:100%; height:100%; }
  .diag-icon-hub svg.lines .stroke { stroke:var(--ed-orange); stroke-width:1.5; fill:none; stroke-dasharray:4 4; }
  .diag-icon-hub svg.lines .head { fill:var(--ed-orange); }

  .terminal { background:var(--ed-callout-ink); border-radius:12px; padding:20px; color:#fff; font-family:var(--font-mono); font-size:14px; line-height:1.6; }
  .terminal-bar { display:flex; gap:6px; margin-bottom:12px; }
  .terminal-bar .dot { width:10px; height:10px; border-radius:50%; }
  .terminal-bar .r { background:#FF5F56; } .terminal-bar .y { background:#FFBD2E; } .terminal-bar .g { background:#27C93F; }
  .cmt { color:rgba(255,255,255,.45); } .key { color:#E8B4A0; } .val { color:#B79CF2; } .kw { color:#FBBF77; } .num { color:#C1DE9E; }

  .perm-table { display:flex; flex-direction:column; gap:10px; width:100%; }
  .perm-row { display:grid; grid-template-columns:120px 1fr; gap:16px; align-items:center; border:1.5px solid var(--ed-line-ink); border-radius:14px; padding:14px 16px; }
  .perm-user { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .avatar { width:44px; height:44px; position:relative; }
  .avatar svg { width:100%; height:100%; stroke:var(--ed-line-ink); stroke-width:1.5; fill:none; }
  .avatar .crown { position:absolute; bottom:-2px; right:-2px; width:18px; height:18px; background:var(--ed-orange); color:#fff; border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; }
  .role { font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ed-ink); }
  .perm-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .perm-cell { border:1.5px solid var(--ed-line-ink); border-radius:8px; padding:6px 10px; display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--ed-ink); }
  .yes { color:var(--ed-line-mint); } .no { color:var(--ed-line-red); }

  .checklist { display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
  .checklist li { display:flex; align-items:center; gap:12px; font-family:var(--font-display); font-weight:500; font-size:20px; color:var(--ed-ink); }
  .checklist .tick { color:var(--ed-line-mint); font-size:22px; width:22px; }

  .scene { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; width:100%; }
  .mock { border:1.5px solid var(--ed-line-ink); border-radius:12px; padding:14px; background:var(--ed-node-fill); min-height:200px; display:flex; flex-direction:column; gap:8px; position:relative; }
  .mock-head { font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ed-ink-muted); border-bottom:1px dashed var(--ed-ink-faint); padding-bottom:6px; }
  .mock-field { border:1px solid var(--ed-line-ink); border-radius:8px; padding:8px 10px; font-family:var(--font-mono); font-size:12px; color:var(--ed-ink-muted); }
  .mock-btn { background:var(--ed-orange); color:#fff; border-radius:8px; padding:8px 10px; font-family:var(--font-display); font-weight:700; font-size:12px; text-align:center; }
  .mock.locked .mock-body { filter:blur(1px); opacity:.4; display:flex; flex-direction:column; gap:6px; }
  .mock-overlay { position:absolute; inset:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-family:var(--font-mono); font-size:14px; color:var(--ed-line-red); }
  .scene-arrow { font-family:var(--font-mono); font-size:22px; color:var(--ed-orange); }
</style></head>
<body>
  <div class="hd">
    <div class="lbl">FLOW CHAIN</div>
    <div class="note">Update 3</div>
  </div>
  <div class="stage"><div class="diag-flow">
  <div class="node">Input</div><div class="arrow">→</div>
  <div class="node">Process</div><div class="arrow">→</div>
  <div class="node filled">Focus</div><div class="arrow">→</div>
  <div class="node">Output</div>
</div></div>
</body></html>
