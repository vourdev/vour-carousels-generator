<!-- @dsCard group="Colors" viewport="700x180" name="Editorial · Paper + Ink" subtitle="Cream surfaces, warm ink hierarchy" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-editorial); font-family:var(--font-mono); color:var(--ed-ink-soft); }
  .row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .sw { padding:10px; border-radius:10px; border:1px solid rgba(31,9,4,0.06); background:#fff8; }
  .chip { width:100%; height:56px; border-radius:6px; margin-bottom:8px; border:1px solid rgba(31,9,4,0.06); }
  .name { font-size:10px; color:var(--ed-ink-muted); }
  .val { font-size:12px; margin-top:4px; color:var(--ed-ink); }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FBF6EF"></div><div class="name">--ed-paper</div><div class="val">#FBF6EF</div></div>
  <div class="sw"><div class="chip" style="background:#F4ECDE"></div><div class="name">--ed-paper-tint</div><div class="val">#F4ECDE</div></div>
  <div class="sw"><div class="chip" style="background:#1F0904"></div><div class="name">--ed-ink</div><div class="val">#1F0904</div></div>
  <div class="sw"><div class="chip" style="background:#3D1F15"></div><div class="name">--ed-ink-soft</div><div class="val">#3D1F15</div></div>
  <div class="sw"><div class="chip" style="background:#6E4B3E"></div><div class="name">--ed-ink-muted</div><div class="val">#6E4B3E</div></div>
  <div class="sw"><div class="chip" style="background:#A48C7E"></div><div class="name">--ed-ink-faint</div><div class="val">#A48C7E</div></div>
</div>
</body></html>
