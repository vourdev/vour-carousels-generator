<!-- @dsCard group="Components" viewport="1080x740" name="Slide primitives" subtitle="Eyebrow, PageCounter, InfoCard, DarkCallout, NumberedStep, Highlight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide primitives</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--bg-editorial); padding: 40px; margin: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .panel { padding: 32px; border-radius: 20px; background: rgba(31,9,4,0.03); }
  .panel h3 {
    margin: 0 0 24px;
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ed-ink-muted);
  }
  .stack { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {
  Eyebrow, PageCounter,
  Highlight, DarkCallout, NumberedStep, InfoCard,
} = window.VourDevDesignSystemUpdate2_f6a5de;

function App() {
  return (
    <div className="grid">
      {/* Editorial small primitives */}
      <div className="panel">
        <h3>Eyebrow · PageCounter</h3>
        <Eyebrow>What is it</Eyebrow>
        <div style={{height: 16}} />
        <PageCounter index={2} total={10} />
      </div>

      {/* Info cards */}
      <div className="panel">
        <h3>InfoCard · DarkCallout</h3>
        <InfoCard tone="peach" icon="lucide:file-text"
          title="Token rationale"
          body="WHY and WHEN to use each color, not just the hex value." />
        <div style={{height: 16}} />
        <InfoCard tone="sky" icon="lucide:square-stack"
          title="Hierarchy rules"
          body="One CTA per viewport. This color never goes on buttons." />
        <div style={{height: 16}} />
        <DarkCallout icon="lucide:check-circle">
          Claude reads that description and respects the constraint.
        </DarkCallout>
      </div>

      {/* Numbered steps + Highlight */}
      <div className="panel" style={{gridColumn: '1 / -1'}}>
        <h3>Numbered steps · Highlight</h3>
        <div className="stack">
          <NumberedStep n={1} title="Start minimal"
            body="Your colors, fonts, and 3 hierarchy rules. Even that beats prompting from scratch." />
          <NumberedStep n={2} title="Write what NOT to do"
            body={'Claude follows constraints better than instructions. "Don\u2019t use more than 2 font weights" beats "use variety thoughtfully."'} />
          <NumberedStep n={3} title="Swap and test"
            body="Change the palette, type pairing, or radius scale and regenerate. Fastest way to explore visual directions." />
        </div>
        <div style={{height: 24}} />
        <Highlight strong="I'll be sharing them with everyone." sub="Follow for early access." />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
