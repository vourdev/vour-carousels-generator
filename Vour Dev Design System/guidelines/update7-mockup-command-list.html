<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  body {
    margin:0; padding:28px 28px 20px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display:flex; flex-direction:column; gap:14px; overflow:hidden;
  }
  .hd { display:flex; align-items:center; justify-content:space-between; }
  .lbl {
    font-family: var(--font-mono); font-size:11px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .note { font-family: var(--font-mono); font-size:11px; color: var(--ed-ink-faint); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; }

  .list { width: 100%; max-width: 540px; display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid rgba(31,9,4,.12); }
  .row .cmd { font-family: var(--font-mono); font-weight:600; font-size: 15px; color: var(--ed-orange); }
  .row .arr { font-family: var(--font-mono); font-size: 14px; color: var(--ed-ink-muted); }
  .row .desc { font-family: var(--font-body); font-weight:500; font-size: 13px; color: var(--ed-ink-soft); }
</style></head><body>
  <div class="hd"><div class="lbl">CommandList</div><div class="note">/cmd → desc menu</div></div>
  <div class="stage">
    <div class="list">
      <div class="row"><span class="cmd">/script</span><span class="arr">→</span><span class="desc">script video/reel</span></div>
      <div class="row"><span class="cmd">/hook</span><span class="arr">→</span><span class="desc">opening line yang nempel</span></div>
      <div class="row"><span class="cmd">/carousel</span><span class="arr">→</span><span class="desc">konten per-slide</span></div>
      <div class="row"><span class="cmd">/headlines</span><span class="arr">→</span><span class="desc">beberapa opsi judul</span></div>
      <div class="row"><span class="cmd">/authority</span><span class="arr">→</span><span class="desc">nada ahli / expert</span></div>
    </div>
  </div>
</body></html>
