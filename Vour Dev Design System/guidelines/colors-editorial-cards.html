<!-- @dsCard group="Colors" viewport="700x220" name="Editorial · Card tones" subtitle="OPAQUE card backgrounds — Update 2 expanded the family" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-editorial); font-family:var(--font-mono); color:var(--ed-ink-soft); }
  .row { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
  .sw { padding:10px; border-radius:10px; }
  .chip { width:100%; height:70px; border-radius:10px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; font-size:14px; color:var(--ed-ink); }
  .name { font-size:10px; color:var(--ed-ink-muted); }
  .val { font-size:12px; margin-top:4px; color:var(--ed-ink); }
  .role { font-size:11px; color:var(--ed-ink-muted); margin-top:4px; font-family:var(--font-body); font-style:italic; }
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FBE9D9">Aa</div><div class="name">--ed-card-peach</div><div class="val">#FBE9D9</div><div class="role">default</div></div>
  <div class="sw"><div class="chip" style="background:#EDE7DA">Aa</div><div class="name">--ed-card-stone</div><div class="val">#EDE7DA</div><div class="role">scraped/loser</div></div>
  <div class="sw"><div class="chip" style="background:#E3F1E1">Aa</div><div class="name">--ed-card-mint</div><div class="val">#E3F1E1</div><div class="role">success</div></div>
  <div class="sw"><div class="chip" style="background:#DEEAF7">Aa</div><div class="name">--ed-card-sky</div><div class="val">#DEEAF7</div><div class="role">tooling</div></div>
  <div class="sw"><div class="chip" style="background:#F7DDE6">Aa</div><div class="name">--ed-card-pink</div><div class="val">#F7DDE6</div><div class="role">design</div></div>
  <div class="sw"><div class="chip" style="background:#FBE7B0">Aa</div><div class="name">--ed-card-amber</div><div class="val">#FBE7B0</div><div class="role">highlight</div></div>
</div>
</body></html>
