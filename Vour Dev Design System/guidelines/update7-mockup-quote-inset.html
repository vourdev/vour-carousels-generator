<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  body {
    margin:0; padding:28px 28px 20px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display:flex; flex-direction:column; gap:14px; overflow:hidden;
  }
  .hd { display:flex; align-items:center; justify-content:space-between; }
  .lbl {
    font-family: var(--font-mono); font-size:11px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .note { font-family: var(--font-mono); font-size:11px; color: var(--ed-ink-faint); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; }

  .quote {
    max-width: 540px;
    padding: 12px 16px 12px 20px;
    border-left: 3px solid var(--ed-orange);
    background: var(--ed-card-stone);
    border-radius: 4px;
    font-family: var(--font-body); font-weight: 500; font-style: italic;
    font-size: 15px; line-height: 1.55; color: var(--ed-ink);
  }
</style></head><body>
  <div class="hd"><div class="lbl">QuoteInset</div><div class="note">Italic left-border block</div></div>
  <div class="stage">
    <blockquote class="quote">
      Banyak creator pilih produk affiliate karena "kayaknya laku" — bukan karena udah dibandingin beneran.
    </blockquote>
  </div>
</body></html>
