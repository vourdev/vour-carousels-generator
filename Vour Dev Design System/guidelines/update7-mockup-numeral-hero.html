<!-- @dsCard group="Mockups · Update 7" viewport="620x520" name="NumeralHero" subtitle="Massive numeral + short headline underneath — count/cover slides" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  body {
    margin:0; padding:28px 28px 20px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display:flex; flex-direction:column; gap:14px; overflow:hidden;
  }
  .hd { display:flex; align-items:center; justify-content:space-between; }
  .lbl {
    font-family: var(--font-mono); font-size:11px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .note { font-family: var(--font-mono); font-size:11px; color: var(--ed-ink-faint); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; }

  .num {
    font-family: var(--font-display); font-weight:800;
    font-size: 260px; line-height:.85; color: var(--ed-orange);
    letter-spacing:-.04em;
  }
  .num-title { font-family: var(--font-display); font-weight:800; font-size:32px; line-height:1.05; color: var(--ed-ink); letter-spacing:-.02em; margin-top:8px; }
  .num-sub { font-family: var(--font-body); font-weight:500; font-size:14px; color: var(--ed-ink-soft); margin-top:6px; max-width: 340px; }
</style></head><body>
  <div class="hd"><div class="lbl">NumeralHero</div><div class="note">Cover / intro count</div></div>
  <div class="stage">
    <div>
      <div class="num">6</div>
      <div class="num-title">istilah AI<br>yang wajib lo tau</div>
      <div class="num-sub">biar lo gak cuma nge-prompt doang tapi ngerti cara kerjanya.</div>
    </div>
  </div>
</body></html>
