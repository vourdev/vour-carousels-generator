<style>
  html, body { width:1080px; height:1350px; }
  body {
    margin:0; padding:96px 80px 80px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .counter { font-family: var(--font-mono); font-size:24px; color: var(--ed-ink-faint); letter-spacing:.04em; }
  .eyebrow {
    font-family: var(--font-mono); font-weight:500; font-size:24px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
    margin-top: 48px;
  }
  h1 {
    font-family: var(--font-display); font-weight:800;
    font-size: 88px; line-height: 1.04; letter-spacing:-.025em;
    margin: 24px 0 0; color: var(--ed-ink);
  }
  h1 .a { color: var(--ed-orange); }
  .body-text {
    font-family: var(--font-body); font-weight:500; font-size:30px;
    line-height:1.4; color: var(--ed-ink-soft); margin: 24px 0 0;
    max-width: 900px;
  }
  .body-text strong { color: var(--ed-ink); font-weight: 700; }
  .diag-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 32px;
  }
  .catatan {
    border: 1.5px solid var(--ed-orange); border-radius: 16px;
    padding: 20px 28px; margin-top: 32px;
  }
  .catatan-label {
    font-family: var(--font-mono); font-weight:500; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .catatan-body {
    margin-top: 6px; font-family: var(--font-display); font-weight:700;
    font-size: 28px; color: var(--ed-ink); line-height: 1.2;
  }

  .card-w { width: 100%; display: flex; flex-direction: column; gap: 32px; align-items: stretch; }
  .card {
    position: relative;
    border: 2.5px solid var(--ed-orange); border-radius: 22px;
    padding: 44px 44px 40px; background: var(--ed-paper);
  }
  .card .label {
    position: absolute; top: -14px; left: 32px;
    padding: 4px 14px; background: var(--ed-paper);
    font-family: var(--font-mono); font-weight:500; font-size: 20px;
    letter-spacing:.18em; text-transform: uppercase; color: var(--ed-orange);
  }
  .card .body {
    font-family: var(--font-mono); font-size: 30px; line-height: 1.55;
    color: var(--ed-ink);
  }
  .card .body .ph { color: var(--ed-orange); font-weight: 700; }
  .kapan-label {
    font-family: var(--font-mono); font-weight:500; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .kapan-body {
    margin-top: 10px; font-family: var(--font-body); font-weight:500;
    font-size: 30px; line-height:1.4; color: var(--ed-ink-soft);
  }
</style></head><body>
  <div class="counter">01 / 07</div>
  <div class="eyebrow">Prompt 01</div>
  <h1>Bikin 10 hook<br>sekali <span class="a">prompt.</span></h1>
  <div class="diag-wrap" style="align-items:center;">
    <div class="card-w">
      <div class="card">
        <span class="label">Copy this</span>
        <div class="body">Buatin gue 10 hook buat postingan tentang <span class="ph">[TOPIK]</span>, masing-masing pake sudut pandang beda: takut, penasaran, statistik, cerita, kontroversial.</div>
      </div>
      <div>
        <div class="kapan-label">Kapan dipake</div>
        <div class="kapan-body">Pas lo udah ada topik tapi bingung mau buka gimana.</div>
      </div>
    </div>
  </div>
</body></html>
