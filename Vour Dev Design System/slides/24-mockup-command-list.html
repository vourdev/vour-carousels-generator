<style>
  html, body { width:1080px; height:1350px; }
  body {
    margin:0; padding:96px 80px 80px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .counter { font-family: var(--font-mono); font-size:24px; color: var(--ed-ink-faint); letter-spacing:.04em; }
  .eyebrow {
    font-family: var(--font-mono); font-weight:500; font-size:24px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
    margin-top: 48px;
  }
  h1 {
    font-family: var(--font-display); font-weight:800;
    font-size: 88px; line-height: 1.04; letter-spacing:-.025em;
    margin: 24px 0 0; color: var(--ed-ink);
  }
  h1 .a { color: var(--ed-orange); }
  .body-text {
    font-family: var(--font-body); font-weight:500; font-size:30px;
    line-height:1.4; color: var(--ed-ink-soft); margin: 24px 0 0;
    max-width: 900px;
  }
  .body-text strong { color: var(--ed-ink); font-weight: 700; }
  .diag-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 32px;
  }
  .catatan {
    border: 1.5px solid var(--ed-orange); border-radius: 16px;
    padding: 20px 28px; margin-top: 32px;
  }
  .catatan-label {
    font-family: var(--font-mono); font-weight:500; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .catatan-body {
    margin-top: 6px; font-family: var(--font-display); font-weight:700;
    font-size: 28px; color: var(--ed-ink); line-height: 1.2;
  }

  .list { width: 100%; display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 32px;
    padding: 24px 4px;
    border-bottom: 1.5px solid rgba(31,9,4,.14);
  }
  .row .cmd {
    font-family: var(--font-mono); font-weight:600; font-size: 40px;
    color: var(--ed-orange); min-width: 260px;
  }
  .row .arr { font-family: var(--font-mono); font-size: 32px; color: var(--ed-ink-muted); }
  .row .desc {
    font-family: var(--font-body); font-weight:500; font-size: 30px;
    color: var(--ed-ink-soft);
  }
</style></head><body>
  <div class="counter">05 / 12</div>
  <div class="eyebrow">Bikin konten</div>
  <h1>Command<br><span class="a">shortcuts.</span></h1>
  <div class="diag-wrap" style="align-items:flex-start;">
    <div class="list">
      <div class="row"><span class="cmd">/script</span><span class="arr">→</span><span class="desc">script video/reel</span></div>
      <div class="row"><span class="cmd">/hook</span><span class="arr">→</span><span class="desc">opening line yang nempel</span></div>
      <div class="row"><span class="cmd">/carousel</span><span class="arr">→</span><span class="desc">konten per-slide</span></div>
      <div class="row"><span class="cmd">/headlines</span><span class="arr">→</span><span class="desc">beberapa opsi judul</span></div>
      <div class="row"><span class="cmd">/authority</span><span class="arr">→</span><span class="desc">nada ahli / expert</span></div>
    </div>
  </div>
  <div class="catatan">
    <div class="catatan-label">Takeaway</div>
    <div class="catatan-body">Gabungin /hook + /authority buat konten kredibel.</div>
  </div>
</body></html>
