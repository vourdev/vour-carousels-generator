<!-- @dsCard group="Slides" viewport="1080x1350" name="Editorial · Cover" subtitle="Big headline with one-word orange accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width:1080px; height:1350px; }
  body {
    margin:0; padding:96px 80px 80px;
    background: var(--bg-editorial);
    color: var(--ed-ink);
    font-family: var(--font-body);
    display: flex; flex-direction: column;
  }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:16px; }
  .disc { width:48px; height:48px; border-radius:50%; overflow:hidden; background:#07070e; }
  .disc img { width:100%; height:100%; object-fit:cover; display:block; }
  .handle { font-family:var(--font-body); font-weight:700; font-size:28px; color:var(--ed-ink); }
  .counter { font-family:var(--font-mono); font-size:24px; color:var(--ed-ink-faint); letter-spacing:.04em; }
  .body { flex:1; display:flex; flex-direction:column; justify-content:center; gap:32px; }
  h1 {
    font-family:var(--font-display); font-weight:800;
    font-size:144px; line-height:1.02; letter-spacing:-.025em;
    margin:0; color:var(--ed-ink);
  }
  h1 .accent { color: var(--ed-orange); }
  .lede {
    font-family:var(--font-body); font-weight:500;
    font-size:40px; line-height:1.3;
    color: var(--ed-ink-soft); max-width:880px; margin:0;
  }
  .foot { font-family:var(--font-mono); font-size:22px; color:var(--ed-ink-muted); letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <div class="disc"><img src="../assets/vourdev-logo.jpeg" alt="@vourdev"></div>
      <span class="handle">@vourdev</span>
    </div>
    <div class="counter">01 / 10</div>
  </div>
  <div class="body">
    <h1>I dropped a<br>DESIGN.md into<br>Claude <span class="accent">Design.</span></h1>
    <p class="lede">Here's what they actually are, why most are made by devs not designers, and what you can do about it…</p>
  </div>
  <div class="foot">Geser →</div>
</body>
</html>
