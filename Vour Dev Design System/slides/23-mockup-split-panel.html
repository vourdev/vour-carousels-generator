<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Split panel — mockup example</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--ed-paper); font-family: var(--font-body); color: var(--ed-ink); }
  .slide {
    width: 1080px; height: 1350px;
    padding: var(--pad-ig-top) var(--pad-ig-x) var(--pad-ig-bottom);
    box-sizing: border-box;
    display: flex; flex-direction: column;
    background: var(--halo-editorial-1), var(--halo-editorial-2), var(--ed-paper);
  }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .counter { font-family: var(--font-mono); font-size: var(--fs-counter); color: var(--ed-ink-muted); letter-spacing: 0.06em; }
  .eyebrow { margin-top: 48px; font-family: var(--font-mono); font-size: var(--fs-eyebrow); text-transform: uppercase; letter-spacing: var(--tracking-eyebrow); color: var(--ed-orange); font-weight: 500; }
  h1.compact { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-title-sm); line-height: var(--lh-title-sm); letter-spacing: var(--tracking-display); color: var(--ed-ink); margin: 24px 0 0; }
  h1.compact .a { color: var(--ed-orange); }
  .body { font-family: var(--font-body); font-size: var(--fs-body-lg); line-height: var(--lh-body); color: var(--ed-ink-soft); margin-top: 32px; max-width: 900px; }
  .diag-wrap { flex: 1; min-height: 0; margin-top: 40px; display: flex; align-items: stretch; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { SplitPanel, ImagePlate } = window.VourDevDesignSystemUpdate2_f6a5de;
function App() {
  return (
    <div className="slide">
      <div className="head">
        <div className="counter">05 / 08</div>
      </div>

      <div className="eyebrow">[Cara Baru]</div>
      <h1 className="compact">Terminal <span className="a">sebagai IDE.</span></h1>

      {/* §17 — two-column SplitPanel fills the full .diag-wrap */}
      <div className="diag-wrap">
        <SplitPanel
          eyebrow="[why it matters]"
          heading="Satu prompt, satu build."
          body="MiMoCode duduk di terminal — nggak ada tab-switch, nggak ada copy-paste sidebar. Ketik, lihat hasil, deploy."
        >
          <ImagePlate
            src="../assets/example-mimocode.png"
            variant="window-mac"
            chromeLabel="MiMoCode"
            fit="cover"
          />
        </SplitPanel>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
