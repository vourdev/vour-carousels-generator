<style>
  html, body { width:1080px; height:1350px; }
  body {
    margin:0; padding:96px 80px 80px;
    background: var(--bg-editorial); color: var(--ed-ink);
    font-family: var(--font-body);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .counter { font-family: var(--font-mono); font-size:24px; color: var(--ed-ink-faint); letter-spacing:.04em; }
  .eyebrow {
    font-family: var(--font-mono); font-weight:500; font-size:24px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
    margin-top: 48px;
  }
  h1 {
    font-family: var(--font-display); font-weight:800;
    font-size: 88px; line-height: 1.04; letter-spacing:-.025em;
    margin: 24px 0 0; color: var(--ed-ink);
  }
  h1 .a { color: var(--ed-orange); }
  .body-text {
    font-family: var(--font-body); font-weight:500; font-size:30px;
    line-height:1.4; color: var(--ed-ink-soft); margin: 24px 0 0;
    max-width: 900px;
  }
  .body-text strong { color: var(--ed-ink); font-weight: 700; }
  .diag-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 32px;
  }
  .catatan {
    border: 1.5px solid var(--ed-orange); border-radius: 16px;
    padding: 20px 28px; margin-top: 32px;
  }
  .catatan-label {
    font-family: var(--font-mono); font-weight:500; font-size:22px;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-orange);
  }
  .catatan-body {
    margin-top: 6px; font-family: var(--font-display); font-weight:700;
    font-size: 28px; color: var(--ed-ink); line-height: 1.2;
  }

  .pair { display: flex; flex-direction: column; gap: 28px; width: 100%; }
  .pair .card { border-radius: 24px; padding: 36px 40px; }
  .pair .scraped { background: var(--ed-card-stone); }
  .pair .designed { background: var(--ed-card-peach); }
  .pair .lbl-in {
    font-family: var(--font-mono); font-size:22px; font-weight:500;
    letter-spacing:.18em; text-transform:uppercase; color: var(--ed-ink-muted);
  }
  .pair .designed .lbl-in { color: var(--ed-orange); }
  .pair .k { font-family: var(--font-mono); font-size:36px; color: var(--ed-ink); margin-top:14px; letter-spacing:-.01em; }
  .pair .v { font-family: var(--font-body); font-weight:500; font-size:28px; line-height:1.45; color: var(--ed-ink-soft); margin-top:16px; }
</style></head><body>
  <div class="counter">05 / 10</div>
  <div class="eyebrow">The key difference</div>
  <h1>The WHAT without<br>the <span class="a">WHY.</span></h1>
  <div class="diag-wrap" style="align-items:center;">
    <div class="pair">
      <div class="card scraped">
        <div class="lbl-in">Scraped</div>
        <div class="k">primary: #C62828</div>
      </div>
      <div class="card designed">
        <div class="lbl-in">Designed</div>
        <div class="k">primary: #C62828</div>
        <div class="v">Deep warm red — reserved exclusively for purchase-path actions. Never used decoratively.</div>
      </div>
    </div>
  </div>
</body></html>
